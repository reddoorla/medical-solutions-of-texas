<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48x48.png" />

    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="google-site-verification" content="LUqp6fAiix3BaJm7OjOuBrwjRKZ58FJMS1yurgKN2Hk" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preload" as="style" href="https://use.typekit.net/noj4tji.css" />
    <link
      rel="stylesheet"
      href="https://use.typekit.net/noj4tji.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://use.typekit.net/noj4tji.css" />
    </noscript>

    <!-- Google tag (gtag.js): GA4, hard-coded, counts every page view. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZ0WQMEE8L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-BZ0WQMEE8L");
    </script>
    <!--
      Google Tag Manager (GTM-T4RZ2F54, MSOT Marketing's container; it fires the
      LinkedIn Insight Tag). It loads on the visitor's first pointer, wheel, key
      or touch event, the same events as VimeoGate.svelte (a pointermove only
      if the pointer really moved), never on page load:
      the LinkedIn tag's third-party cookies take Lighthouse Best Practices from
      100 to about 78 when they load unprompted (decision 2207, answer 1). No
      <noscript> iframe: without JavaScript it loads a frame that runs no tags.
      GA4 stays above, outside GTM, so page views are never counted twice.
    -->
    <script>
      (function (w, d, id) {
        var events = ["pointerdown", "pointermove", "wheel", "keydown", "touchstart"];
        function load(e) {
          // Chromium fires a pointermove with no movement when the layout shifts
          // under a resting cursor (4 of 6 headless loads of /contact). It is
          // not a visitor, so it must not load the tag in a Lighthouse run.
          if (e.type === "pointermove" && !e.movementX && !e.movementY) return;
          events.forEach(function (e) {
            w.removeEventListener(e, load);
          });
          w.dataLayer = w.dataLayer || [];
          w.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var s = d.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtm.js?id=" + id;
          d.head.appendChild(s);
        }
        events.forEach(function (e) {
          w.addEventListener(e, load, { passive: true });
        });
      })(window, document, "GTM-T4RZ2F54");
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background-color: #140f09">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
