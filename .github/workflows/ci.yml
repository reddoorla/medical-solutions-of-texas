name: ci
on:
  pull_request:
  push:
    branches: [main, staging]
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: reddoorla/.github/.github/workflows/ci.yml@c714d9e472885bbf66f386e9f056a16aab7986d2 # v1.4.2
    with:
      node-version: "24"
      # The deploy-preview comment defaults to the repo name, but this repo has
      # two Netlify sites. msot-landing serves medicalsolutionsoftx.com and
      # built every PR measured (#105, #106, #108, #109), into staging and main;
      # medical-solutions-of-texas skipped #106, so its link 404ed there.
      netlify-site: "msot-landing"
