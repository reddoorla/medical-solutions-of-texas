# pnpm 11 reads settings from here (the package.json "pnpm" field is no longer read).
allowBuilds:
  # migrate each package from the old onlyBuiltDependencies here as `name: true`
  "@scarf/scarf": false
  protobufjs: true
  sharp: true
minimumReleaseAge: 0
overrides:
  # GHSA-f88m-g3jw-g9cj — imagetools-core@6.0.4 pins sharp ^0.33.1; dedupe onto the direct devDep's 0.35.x
  "sharp@<0.35.0": ^0.35.0
